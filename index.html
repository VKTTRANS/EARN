<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smart Booking</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --input-bg: #f9fafb;
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    body { font-family: 'Prompt', sans-serif; background-color: var(--bg); color: var(--text); padding: 2rem 0; }
    
    /* กาง 95% โดยไม่มีลิมิต max-width แล้ว */
    .main-wrap { width: 95%; max-width: 100%; margin: 0 auto; background: var(--card-bg); border-radius: var(--radius-lg); box-shadow: 0 20px 40px rgba(0,0,0,0.04); padding: 2.5rem; }
    
    h2 { font-weight: 700; color: #111827; letter-spacing: -0.5px; }

    .btn-main { background: linear-gradient(135deg, var(--primary), #3b82f6); border: none; color: white; padding: 12px 28px; border-radius: 12px; font-weight: 500; box-shadow: 0 8px 16px rgba(79, 70, 229, 0.2); transition: all 0.3s ease; white-space: nowrap; }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 12px 20px rgba(79, 70, 229, 0.3); color: white; }

    /* ปรับแต่งตารางให้สไลด์ลื่นขึ้นในมือถือ */
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 12px; }
    .table-modern { margin-top: 1.5rem; border-collapse: separate; border-spacing: 0; width: 100%; min-width: 900px; }
    .table-modern th { background: #f8fafc; color: var(--text-muted); font-weight: 600; padding: 16px; border-bottom: 2px solid var(--border); font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    .table-modern td { padding: 16px; vertical-align: middle; border-bottom: 1px solid var(--border); color: #374151; font-size: 0.95rem; }

    .form-label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
    .form-control, .form-select { background-color: var(--input-bg); border: 1.5px solid var(--border); border-radius: 12px; padding: 14px 16px; font-size: 1rem; color: var(--text); transition: all 0.2s; box-shadow: none; }
    .form-control:focus, .form-select:focus { background-color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
    
    .input-group .btn-outline { background: var(--input-bg); border: 1.5px solid var(--border); border-left: none; color: var(--primary); font-weight: bold; border-radius: 0 12px 12px 0; padding: 0 20px; transition: 0.2s; }
    .input-group .btn-outline:hover { background: var(--primary); color: white; border-color: var(--primary); }

    .vehicle-card { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: var(--radius-md); padding: 1.5rem; margin-bottom: 1rem; transition: 0.3s; }
    .vehicle-card:hover { border-color: var(--primary); background: #f1f5f9; }

    .modal-content { border-radius: var(--radius-lg); border: none; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .modal-header { padding: 1.5rem 2rem; border-bottom: 1px solid var(--border); }
    .modal-title { font-weight: 700; color: #111827; }
    .modal-body { padding: 2rem; }
    .modal-footer { padding: 1.5rem 2rem; border-top: 1px solid var(--border); background: #f9fafb; border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

    @media (max-width: 768px) {
      body { padding: 0; background: var(--card-bg); }
      .main-wrap { width: 100%; border-radius: 0; padding: 1.25rem; box-shadow: none; }
      .btn-main { width: 100%; }
      .table-modern { font-size: 0.85rem; min-width: 800px; } /* บังคับกว้างเพื่อให้เกิด Scroll บนมือถือ ป้องกันตารางบีบ */
      
      .modal-dialog { margin: 0; display: flex; align-items: flex-end; min-height: 100%; }
      .modal-content { border-radius: 30px 30px 0 0; padding-bottom: env(safe-area-inset-bottom); }
      .modal-body { padding: 1.5rem; max-height: 85vh; overflow-y: auto; }
    }
  </style>
</head>
<body>

  <div class="main-wrap">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
      <h2>🚚 Smart Booking</h2>
      <button type="button" class="btn-main" data-bs-toggle="modal" data-bs-target="#bookingModal">
        + สร้างรายการใหม่
      </button>
    </div>

    <div class="table-responsive">
      <table class="table-modern">
        <thead>
          <tr>
            <th>เลขงาน</th><th>วันที่</th><th>ลูกค้า</th><th>สถานที่รับ</th><th>สถานที่ส่ง</th><th>รถ/ประเภท</th><th>ทะเบียน</th><th>คนขับ</th><th>หมายเหตุ</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">เพิ่มรายการ Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="bookingForm">
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label class="form-label">วันที่เริ่มงาน</label>
                <input type="date" class="form-control" name="date" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">จำนวนรถ (คัน)</label>
                <input type="number" class="form-control" name="qty" id="qtyInput" value="1" min="1" max="20" onchange="generateVehicleFields()" required>
              </div>
              
              <div class="col-md-12">
                <label class="form-label">ลูกค้า</label>
                <div class="input-group">
                  <select class="form-select" id="customerSelect" name="customer" required><option value="">-- เลือกลูกค้า --</option></select>
                  <button class="btn btn-outline" type="button" onclick="promptAddNew('customer', 'ชื่อลูกค้าใหม่')">+</button>
                </div>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">สถานที่รับ</label>
                <div class="input-group">
                  <select class="form-select" id="pickupSelect" name="pickup" required><option value="">-- เลือกสถานที่รับ --</option></select>
                  <button class="btn btn-outline" type="button" onclick="promptAddNew('pickup', 'สถานที่รับใหม่')">+</button>
                </div>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">สถานที่ส่ง (พิมพ์ค้นหาได้)</label>
                <div class="input-group">
                  <input type="text" class="form-control" list="dropoffOptions" id="dropoffInput" name="dropoff" placeholder="-- พิมพ์หรือเลือก --" autocomplete="off" required>
                  <datalist id="dropoffOptions"></datalist>
                  <button class="btn btn-outline" type="button" onclick="promptAddNew('dropoff', 'สถานที่ส่งใหม่')">+</button>
                </div>
              </div>

              <div class="col-md-12 mt-3">
                <label class="form-label">หมายเหตุ / รายละเอียดเพิ่มเติม</label>
                <textarea class="form-control" name="remark" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
              </div>
            </div>

            <hr class="my-4 text-muted">
            <h6 class="fw-bold mb-3 text-primary">รายละเอียดรถและคนขับ</h6>
            
            <div id="vehicleContainer"></div>

          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light rounded-3 px-4 py-2 text-muted fw-medium" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn-main" onclick="submitForm()" id="saveBtn">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // ==========================================
    // ใส่ URL จาก Google Apps Script ตรงนี้
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyZ2wgme02m-aJOmdChLErNbZmBkbu90p4gAB_t11ctWS3TBXwW3iZC7Jsfn8GQzEz6/exec"; 
    // ==========================================

    let vehicleList = [];
    let vehicleOptionsHTML = '<option value="">-- เลือกทะเบียน --</option>';

    window.onload = async function() {
      Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
      try {
        const response = await fetch(GAS_URL + "?action=getInitialData");
        const data = await response.json();
        
        renderTable(data.dashboard);
        processVehicles(data.vehicles);
        
        populateDropdown("customerSelect", data.master.customers, "-- เลือกลูกค้า --");
        populateDropdown("pickupSelect", data.master.pickups, "-- เลือกสถานที่รับ --");
        populateDatalist("dropoffOptions", data.master.dropoffs);
        
        generateVehicleFields(); 
        Swal.close();
      } catch (err) {
        Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อฐานข้อมูลได้: ' + err.message, 'error');
      }
    };

    function renderTable(data) {
      let tbody = document.getElementById("tableBody");
      let html = "";
      for (let i = 1; i < data.length; i++) {
        html += `<tr>
          <td class="fw-bold text-primary">${data[i][0] || ''}</td>
          <td>${data[i][1] || ''}</td>
          <td class="fw-medium">${data[i][2] || ''}</td>
          <td>${data[i][3] || ''}</td>
          <td>${data[i][4] || ''}</td>
          <td>${data[i][5] || '1'} / <span class="badge bg-secondary">${data[i][6] || '-'}</span></td>
          <td class="fw-bold">${data[i][7] || ''}</td>
          <td>${data[i][8] || ''}</td>
          <td><span class="text-muted" style="font-size: 0.85rem;">${data[i][9] || '-'}</span></td>
        </tr>`;
      }
      tbody.innerHTML = html;
    }

    function processVehicles(data) {
      vehicleList = data;
      vehicleOptionsHTML = '<option value="">-- เลือกทะเบียน --</option>';
      data.forEach(row => {
        if(row[0]) vehicleOptionsHTML += `<option value="${row[0]}">${row[0]} ${row[1] ? `(${row[1]})` : ''}</option>`;
      });
    }

    function generateVehicleFields() {
      const qty = parseInt(document.getElementById('qtyInput').value) || 1;
      const container = document.getElementById('vehicleContainer');
      container.innerHTML = ''; 

      const carTypes = ['4 ล้อ', '6 ล้อ', '6 ล้อพ่วง', '10 ล้อ', '10 ล้อพ่วง', 'เทรลเลอร์'];
      let typeOptions = '<option value="">-- เลือกประเภทรถ --</option>';
      carTypes.forEach(t => typeOptions += `<option value="${t}">${t}</option>`);

      for(let i = 1; i <= qty; i++) {
        container.innerHTML += `
          <div class="vehicle-card mb-3">
            <h6 class="fw-bold text-primary mb-3">🚘 รถคันที่ ${i}</h6>
            <div class="row g-3">
              <div class="col-md-4">
                <label class="form-label">ประเภทรถ</label>
                <select class="form-select v-type" required>${typeOptions}</select>
              </div>
              <div class="col-md-4">
                <label class="form-label">ทะเบียนรถ</label>
                <select class="form-select v-plate" onchange="autoFillDriver(this, ${i})" required>
                  ${vehicleOptionsHTML}
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">คนขับ (แก้ไขได้)</label>
                <input type="text" class="form-control v-driver" id="driverInput${i}" required>
              </div>
            </div>
          </div>
        `;
      }
    }

    function autoFillDriver(selectObj, index) {
      const selectedPlate = selectObj.value;
      const driverInput = document.getElementById(`driverInput${index}`);
      const matched = vehicleList.find(v => v[0] === selectedPlate);
      driverInput.value = (matched && matched[2]) ? matched[2] : "";
    }

    function populateDropdown(elementId, items, defaultText) {
      let html = `<option value="">${defaultText}</option>`; 
      items.forEach(item => { if(item) html += `<option value="${item}">${item}</option>`; });
      document.getElementById(elementId).innerHTML = html;
    }

    function populateDatalist(elementId, items) {
      let html = '';
      items.forEach(item => { if(item) html += `<option value="${item}">`; });
      document.getElementById(elementId).innerHTML = html;
    }

    async function promptAddNew(type, label) {
      Swal.fire({
        title: 'เพิ่ม' + label,
        input: 'text',
        inputPlaceholder: 'พิมพ์ที่นี่...',
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        customClass: { confirmButton: 'btn-main mx-2', cancelButton: 'btn btn-light mx-2' },
        buttonsStyling: false,
        inputValidator: (value) => { if (!value) return 'กรุณากรอกข้อมูล!' }
      }).then(async (result) => {
        if (result.isConfirmed) {
          Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
          try {
            const res = await fetch(GAS_URL, {
              method: 'POST', redirect: "follow",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ action: 'addMasterItem', type: type, newValue: result.value.trim() })
            });
            const data = await res.json();
            if(data.status === 'Success') {
              populateDropdown("customerSelect", data.master.customers, "-- เลือกลูกค้า --");
              populateDropdown("pickupSelect", data.master.pickups, "-- เลือกสถานที่รับ --");
              populateDatalist("dropoffOptions", data.master.dropoffs);
              Swal.fire('สำเร็จ!', 'เพิ่มข้อมูลเรียบร้อยแล้ว', 'success');
            }
          } catch(err) { Swal.fire('ผิดพลาด', err.message, 'error'); }
        }
      });
    }

    async function submitForm() {
      let form = document.getElementById("bookingForm");
      if (!form.checkValidity()) { form.reportValidity(); return; }
      
      let vehiclesData = [];
      const vTypes = document.querySelectorAll('.v-type');
      const vPlates = document.querySelectorAll('.v-plate');
      const vDrivers = document.querySelectorAll('.v-driver');
      
      for(let i = 0; i < vTypes.length; i++) {
        vehiclesData.push({
          type: vTypes[i].value,
          plate: vPlates[i].value,
          driver: vDrivers[i].value
        });
      }

      const formData = {
        date: form.date.value,
        customer: form.customer.value,
        pickup: form.pickup.value,
        dropoff: form.dropoff.value,
        qty: form.qty.value,
        remark: form.remark.value, // ดึงค่าหมายเหตุส่งไป
        vehicles: vehiclesData 
      };

      let btn = document.getElementById("saveBtn");
      btn.disabled = true; btn.innerText = "กำลังบันทึก...";
      Swal.fire({ title: 'กำลังสร้าง Booking...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST', redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: 'saveBooking', data: formData })
        });
        const result = await res.json();
        
        if (result.status === 'Success') {
          Swal.fire({
            title: 'สำเร็จ!', text: 'บันทึกข้อมูล Booking เรียบร้อยแล้ว', icon: 'success',
            customClass: { confirmButton: 'btn-main' }, buttonsStyling: false
          }).then(() => location.reload());
        }
      } catch (err) {
        Swal.fire('ผิดพลาด', 'บันทึกไม่สำเร็จ: ' + err.message, 'error');
        btn.disabled = false; btn.innerText = "บันทึกข้อมูล";
      }
    }
  </script>
</body>
</html>
