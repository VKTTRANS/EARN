<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    body {
      font-family: 'Prompt', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 0;
    }

    .main-container {
      width: 95%;
      margin: 0 auto;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    h2 {
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-custom {
      border-radius: 10px;
      padding: 10px 20px;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-primary-custom {
      background-color: var(--primary-color);
      border: none;
      color: white;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .btn-primary-custom:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .table-custom th {
      background-color: #f1f5f9;
      color: #475569;
      font-weight: 500;
      border-bottom: 2px solid var(--border-color);
      padding: 15px;
      white-space: nowrap;
    }

    .table-custom td {
      padding: 15px;
      vertical-align: middle;
      border-bottom: 1px solid var(--border-color);
    }

    .form-control, .form-select {
      border-radius: 10px;
      padding: 12px 15px;
      border: 1px solid var(--border-color);
      background-color: #f8fafc;
      transition: all 0.2s;
    }

    .form-control:focus, .form-select:focus {
      background-color: #fff;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .input-group .btn {
      border-radius: 0 10px 10px 0;
      padding: 0 20px;
      border: 1px solid var(--border-color);
      background: white;
      color: var(--text-main);
      font-weight: 600;
    }

    .modal-content {
      border-radius: var(--radius);
      border: none;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      border-bottom: 1px solid var(--border-color);
      padding: 20px 24px;
    }

    .modal-body {
      padding: 24px;
    }

    .modal-footer {
      border-top: 1px solid var(--border-color);
      padding: 20px 24px;
    }

    @media (max-width: 768px) {
      .main-container {
        width: 100%;
        padding: 15px;
        border-radius: 0;
        box-shadow: none;
      }
      .btn-custom {
        width: 100%;
        margin-bottom: 15px;
      }
      .table-custom {
        font-size: 13px;
      }
      body { padding: 0; }
    }
  </style>
</head>
<body>

  <div class="main-container">
    <h2>🚚 ระบบ Booking รถ</h2>
    
    <div>
      <button type="button" class="btn-custom btn-primary-custom" data-bs-toggle="modal" data-bs-target="#bookingModal">
        + เพิ่มรายการจอง
      </button>
    </div>

    <div class="table-responsive mt-3">
      <table class="table table-hover table-custom">
        <thead>
          <tr>
            <th>เลขงาน</th>
            <th>วันที่</th>
            <th>ลูกค้า</th>
            <th>สถานที่รับ</th>
            <th>สถานที่ส่ง</th>
            <th>จำนวนรถ</th>
            <th>ทะเบียนรถ</th>
            <th>คนขับ</th>
          </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
      </table>
    </div>
  </div>

  <div class="modal fade" id="bookingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">เพิ่มรายการ Booking</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="bookingForm">
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">วันที่เริ่มงาน</label>
              <input type="date" class="form-control" name="date" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">ลูกค้า</label>
              <div class="input-group">
                <select class="form-select" id="customerSelect" name="customer" required>
                  <option value="">-- เลือกลูกค้า --</option>
                </select>
                <button class="btn" type="button" onclick="promptAddNew('customer', 'ชื่อลูกค้าใหม่')">+</button>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">สถานที่รับ</label>
              <div class="input-group">
                <select class="form-select" id="pickupSelect" name="pickup" required>
                  <option value="">-- เลือกสถานที่รับ --</option>
                </select>
                <button class="btn" type="button" onclick="promptAddNew('pickup', 'สถานที่รับใหม่')">+</button>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">สถานที่ส่ง</label>
              <div class="input-group">
                <select class="form-select" id="dropoffSelect" name="dropoff" required>
                  <option value="">-- เลือกสถานที่ส่ง --</option>
                </select>
                <button class="btn" type="button" onclick="promptAddNew('dropoff', 'สถานที่ส่งใหม่')">+</button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium text-muted">จำนวนรถ</label>
              <input type="number" class="form-control" name="qty" value="1" min="1" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">ทะเบียนรถ</label>
              <select class="form-select" id="vehicleSelect" name="vehicle" onchange="updateDriver()">
                <option value="">-- เลือกรถ --</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label fw-medium text-muted">คนขับ (แก้ไขได้)</label>
              <input type="text" class="form-control" id="driverInput" name="driver">
            </div>
          </form>
        </div>
        <div class="modal-footer bg-light">
          <button type="button" class="btn btn-light btn-custom text-muted" data-bs-dismiss="modal">ยกเลิก</button>
          <button type="button" class="btn-custom btn-primary-custom" onclick="submitForm()" id="saveBtn">บันทึกข้อมูล</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let vehicleList = [];

    window.onload = function() {
      google.script.run.withFailureHandler(showError).withSuccessHandler(renderTable).getDashboardData();
      google.script.run.withFailureHandler(showError).withSuccessHandler(loadVehicles).getVehicleData();
      loadAllMasterData();
    };

    function showError(err) {
      Swal.fire('ข้อผิดพลาด', err.message, 'error');
    }

    function renderTable(data) {
      let tbody = document.getElementById("tableBody");
      let html = "";
      for (let i = 1; i < data.length; i++) {
        html += `<tr>
          <td class="fw-medium">${data[i][0] || ''}</td>
          <td>${data[i][1] || ''}</td>
          <td>${data[i][2] || ''}</td>
          <td>${data[i][3] || ''}</td>
          <td>${data[i][4] || ''}</td>
          <td>${data[i][5] || ''}</td>
          <td>${data[i][6] || ''}</td>
          <td>${data[i][7] || ''}</td>
        </tr>`;
      }
      tbody.innerHTML = html;
    }

    function loadAllMasterData() {
      google.script.run.withFailureHandler(showError).withSuccessHandler(function(data) {
        populateDropdown("customerSelect", data.customers, "-- เลือกลูกค้า --");
        populateDropdown("pickupSelect", data.pickups, "-- เลือกสถานที่รับ --");
        populateDropdown("dropoffSelect", data.dropoffs, "-- เลือกสถานที่ส่ง --");
      }).getMasterData();
    }

    function populateDropdown(elementId, items, defaultText) {
      let select = document.getElementById(elementId);
      select.innerHTML = ''; 
      
      let defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.text = defaultText;
      select.appendChild(defaultOption);
      
      items.forEach(item => {
        if(item) {
          let option = document.createElement("option");
          option.value = item;
          option.text = item;
          select.appendChild(option);
        }
      });
    }

    function promptAddNew(type, label) {
      Swal.fire({
        title: 'เพิ่ม' + label,
        input: 'text',
        inputPlaceholder: 'พิมพ์' + label + 'ตรงนี้...',
        showCancelButton: true,
        confirmButtonText: 'บันทึก',
        cancelButtonText: 'ยกเลิก',
        customClass: {
          confirmButton: 'btn-custom btn-primary-custom mx-2',
          cancelButton: 'btn-custom btn-light mx-2'
        },
        buttonsStyling: false,
        inputValidator: (value) => {
          if (!value) return 'กรุณากรอกข้อมูล!'
        }
      }).then((result) => {
        if (result.isConfirmed) {
          let newValue = result.value.trim();
          Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
          
          google.script.run.withFailureHandler(showError).withSuccessHandler(function() {
            Swal.fire('สำเร็จ!', 'เพิ่มข้อมูลเรียบร้อยแล้ว', 'success');
            loadAllMasterData(); 
          }).addMasterItem(type, newValue);
        }
      });
    }

    function loadVehicles(data) {
      vehicleList = data;
      let select = document.getElementById("vehicleSelect");
      select.innerHTML = '';
      
      let defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.text = "-- เลือกรถ --";
      select.appendChild(defaultOption);

      data.forEach(row => {
        if(row[0] && row[0].toString().trim() !== "") {
          let option = document.createElement("option");
          option.value = row[0];
          option.text = row[0] + (row[1] ? " (" + row[1] + ")" : "");
          select.appendChild(option);
        }
      });
    }

    function updateDriver() {
      let selectedVehicle = document.getElementById("vehicleSelect").value;
      let driverInput = document.getElementById("driverInput");
      let matchedVehicle = vehicleList.find(v => v[0] === selectedVehicle);
      if (matchedVehicle && matchedVehicle[2]) {
        driverInput.value = matchedVehicle[2];
      } else {
        driverInput.value = "";
      }
    }

    function submitForm() {
      let form = document.getElementById("bookingForm");
      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }
      
      document.getElementById("saveBtn").disabled = true;
      document.getElementById("saveBtn").innerText = "กำลังบันทึก...";
      
      Swal.fire({ title: 'กำลังบันทึกข้อมูล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() } });
      
      google.script.run.withFailureHandler(function(err) {
        showError(err);
        document.getElementById("saveBtn").disabled = false;
        document.getElementById("saveBtn").innerText = "บันทึกข้อมูล";
      }).withSuccessHandler(function() {
        Swal.fire({
          title: 'สำเร็จ!',
          text: 'บันทึกข้อมูล Booking เรียบร้อยแล้ว',
          icon: 'success',
          confirmButtonText: 'ตกลง',
          customClass: { confirmButton: 'btn-custom btn-primary-custom' },
          buttonsStyling: false
        }).then(() => {
          location.reload();
        });
      }).saveBooking(form);
    }
  </script>
</body>
</html>
